[project]
name = "drone-genesis-project"
version = "0.1.0"
description = "Wind-resistant drone hovering RL on Genesis World (DroneEntity/CF2X) with rsl-rl-lib"
requires-python = ">=3.10,<3.14"  # torch(cu126)のwheelがcp313までのため、3.14が自動選択されないよう上限を設定
dependencies = [
    "torch>=2.8.0",  # Genesisがtorch<2.8.0を非サポートと警告するため明示的に固定
    # 1.2.3では差動RPMがロール/ピッチのトルクを生まない不具合がある(verify_physics.pyで
    # 実測確認)。1.4.1では直っているため、下限を固定する。
    "genesis-world>=1.4.1",
    "rsl-rl-lib>=5.0.0",
    "tensordict",
    "tensorboard",
]

[tool.uv]
# uvは既定で「全OS向け」の解決を一度に行う。genesis-world>=1.4.1 はLinux専用の
# gs-madrona に依存し、それが nvidia-cuda-nvrtc-cu12>=12.8 を要求するため、
# cu126版torch(12.6.x固定)とLinuxで衝突して全体の解決が失敗する。
# このプロジェクトはWindowsでしか動かさないので、解決対象をWindowsに絞る。
environments = ["sys_platform == 'win32'"]

# PyTorchはCUDAビルドをuvのindexで明示的に指定する。
# 使っているCUDAバージョンに合わせて書き換えること(下記はCUDA 12.6の例)。
[tool.uv.sources]
torch = [
  { index = "pytorch-cu126" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true